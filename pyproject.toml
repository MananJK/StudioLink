[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studiolink"
version = "0.1.3"
description = "Sync Ollama-downloaded GGUF models into LM Studio."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "StudioLink contributors" }
]
keywords = ["ollama", "lm-studio", "gguf", "cli", "sync"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MananJK/StudioLink"
Repository = "https://github.com/MananJK/StudioLink"

[project.scripts]
sdl = "studiolink.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
